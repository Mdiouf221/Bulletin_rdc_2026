# Configuration d’assemblage du deuxième Bulletin statistique de la protection sociale en RDC
# Ce fichier définit l’ordre dans lequel les fichiers Markdown doivent être assemblés.

project:
  title: "Deuxième Bulletin statistique de la protection sociale en RDC"
  workspace: "Bulletin_rdc_2026_agents"
  language: "fr"
  output_dir: "10_output"

options:
  include_internal_notes_in_working_version: true
  remove_internal_notes_for_publication_version: true
  generate_word_document: true

outputs:
  working_markdown: "10_output/bulletin_complet_travail.md"
  publication_markdown: "10_output/bulletin_complet_publication.md"
  word_document: "10_output/bulletin_complet.docx"

sections:
